name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint web
        run: npm run lint --workspace=@barangayan/web
      - name: Typecheck web
        run: npm run typecheck --workspace=@barangayan/web
      - name: Build web
        run: npm run build --workspace=@barangayan/web
      - name: Lint resident-web
        run: npm run lint --workspace=@barangayan/resident-web
      - name: Typecheck resident-web
        run: npm run typecheck --workspace=@barangayan/resident-web
      - name: Build resident-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ADMIN_WEB_URL: ${{ secrets.NEXT_PUBLIC_ADMIN_WEB_URL || 'https://admin.example.com' }}
          NEXT_PUBLIC_QRPH_SETTLEMENT_READY: 'false'
        run: npm run build --workspace=@barangayan/resident-web
      - name: Typecheck mobile
        run: npx tsc --noEmit --project apps/resident-android-mobile/tsconfig.json
      - name: Test shared
        run: npm test --workspace=@barangayan/shared --if-present
